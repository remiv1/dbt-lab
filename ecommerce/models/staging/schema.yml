version: 2

models:
  - name: stg_customers
    description: "Clients nettoyés et normalisés"

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - unique

  - name: stg_orders
    description: "Commandes nettoyées et normalisées"

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'cancelled']