version: 2

models:
  - name: stg_customers
    description: "Clients nettoyés et normalisés"

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - unique

  - name: stg_orders
    description: "Commandes nettoyées et normalisées"

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'cancelled']

unit_tests:
  - name: test_stg_customers_normalization
    model: stg_customers
    given:
      - input: source('ecommerce', 'customers')
        rows:
          - customer_id: 101
            first_name: "   Jean Pierre    "
            last_name: "Van der Meer    "
            email: "   jean.PIErr     e@example.com    "
            created_at: "2026-11-20"

          - customer_id: 102
            first_name: "      Sophie    "
            last_name: "    Bernard  "
            email: "  SoPhIe.BerNARd@example.com    "
            created_at: "2026-11-21"
    expect:
      rows:
        - customer_id: 101
          first_name: "JEAN PIERRE"
          last_name: "VAN DER MEER"
          email: "jean.pierre@example.com"
          created_at: "2026-11-20"

        - customer_id: 102
          first_name: "SOPHIE"
          last_name: "BERNARD"
          email: "sophie.bernard@example.com"
          created_at: "2026-11-21"

  - name: test_stg_orders_normalization
    model: stg_orders

    given:
      - input: source('ecommerce', 'orders')
        rows:
          - order_id: 9001
            customer_id: 101
            order_date: '2026-11-20'
            amount: 120.50
            status: "  COMPLETED  "
            row_hash: hash_9001

          - order_id: 9002
            customer_id: 102
            order_date: '2026-11-21'
            amount: 75.00
            status: " Pending "
            row_hash: hash_9002

    expect:
      rows:
        - order_id: 9001
          customer_id: 101
          order_date: '2026-11-20'
          amount: 120.50
          status: "completed"
          row_hash: hash_9001

        - order_id: 9002
          customer_id: 102
          order_date: '2026-11-21'
          amount: 75.00
          status: "pending"
          row_hash: hash_9002