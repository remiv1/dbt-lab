version: 2

models:
  - name: customer_orders
    description: "Synthèse de l'activité commerciale par client"

    columns:
      - name: customer_id
        description: "Identifiant unique du client dans ce modèle"
        data_tests:
          - not_null
          - unique

      - name: order_count
        description: "Nombre de commandes du client"
        data_tests:
          - not_null

      - name: total_amount
        description: "Montant total des commandes du client"

      - name: last_order_date
        description: "Date de la dernière commande du client"

  - name: prospects
    description: "Clients n'ayant passé aucune commande"

    columns:
      - name: customer_id
        description: "Identifiant unique du client"
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: "Prénom du client"

      - name: last_name
        description: "Nom du client"

      - name: email
        description: "Adresse email du client"

      - name: order_id
        description: "Identifiant de la commande (sera NULL pour les prospects)"
        data_tests:
          - is_null

unit_tests:

  - name: test_orders_incremental_initial_load
    description: "Vérifie le chargement initial des commandes dans le modèle incrémental"
    model: orders_incremental

    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_orders')
        rows:
          - order_id: 9001
            customer_id: 101
            order_date: '2026-11-20'
            amount: 100.00
            status: 'completed'
            row_hash: 'hash_a'

          - order_id: 9002
            customer_id: 102
            order_date: '2026-11-21'
            amount: 75.50
            status: 'pending'
            row_hash: 'hash_b'

    expect:
      rows:
        - order_id: 9001
          customer_id: 101
          order_date: '2026-11-20'
          amount: 100.00
          status: 'completed'
          row_hash: 'hash_a'

        - order_id: 9002
          customer_id: 102
          order_date: '2026-11-21'
          amount: 75.50
          status: 'pending'
          row_hash: 'hash_b'