name: CI dbt

on:
  push:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: /tmp/dbt-profile
    defaults:
      run:
        working-directory: ecommerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dbt
        run: python -m pip install dbt==2.0.13

      - name: Configurer le profil dbt
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          ecommerce:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: dbt
                threads: 1
              integration:
                type: duckdb
                path: ./ci.duckdb
                schema: dbt_integration
          EOF

      - name: Construire et tester les modèles
        run: 'dbt build --vars "{raw_schema: dbt_raw}"'

      - name: Tester le chargement incrémental
        run: bash integration_tests/test_orders_incremental.sh