name: CI dbt

on:
  push:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U dbt -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_PROFILES_DIR: /tmp/dbt-profile
      DB_PORT: 15432
      PGPASSWORD: dbt
    defaults:
      run:
        working-directory: ecommerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dbt
        run: pip install dbt-core==1.12.3 dbt-postgres==1.11.0

      - name: Configurer le profil dbt
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          ecommerce:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 15432
                user: dbt
                password: dbt
                dbname: ecommerce
                schema: dbt
                threads: 4
              integration:
                type: postgres
                host: localhost
                port: 15432
                user: dbt
                password: dbt
                dbname: ecommerce
                schema: dbt_integration
                threads: 4
          EOF

      - name: Initialiser les données
        run: psql -h localhost -p "$DB_PORT" -U dbt -d ecommerce -v ON_ERROR_STOP=1 -f ../init-db.sql

      - name: Construire et tester les modèles
        run: dbt build

      - name: Tester le chargement incrémental
        run: bash integration_tests/test_orders_incremental.sh